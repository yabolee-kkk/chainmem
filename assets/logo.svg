<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- 渐变背景 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
    </linearGradient>
    <!-- 链环渐变 -->
    <linearGradient id="chainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <!-- 发光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景圆 -->
  <circle cx="200" cy="200" r="195" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- 背景装饰圆环 -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.5"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.3"/>

  <!-- 链环 1（左侧） -->
  <g filter="url(#softGlow)">
    <path d="M 120 200 
             C 120 150, 170 130, 200 155
             C 230 180, 230 220, 200 245
             C 170 270, 120 250, 120 200 Z" 
          fill="none" stroke="url(#chainGrad)" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- 链环 2（右侧，与链环1交错） -->
  <g filter="url(#softGlow)">
    <path d="M 200 155
             C 230 130, 280 150, 280 200
             C 280 250, 230 270, 200 245
             C 170 220, 170 180, 200 155 Z"
          fill="none" stroke="url(#chainGrad)" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- 链环 1 中的记忆节点 -->
  <g filter="url(#glow)">
    <circle cx="155" cy="185" r="12" fill="#22d3ee" opacity="0.9"/>
    <circle cx="155" cy="185" r="5" fill="#0f172a"/>
  </g>

  <!-- 链环 2 中的记忆节点 -->
  <g filter="url(#glow)">
    <circle cx="245" cy="215" r="12" fill="#a78bfa" opacity="0.9"/>
    <circle cx="245" cy="215" r="5" fill="#0f172a"/>
  </g>

  <!-- 连接线 -->
  <line x1="167" y1="185" x2="200" y2="175" stroke="#22d3ee" stroke-width="2" opacity="0.6"/>
  <line x1="200" y1="225" x2="233" y2="215" stroke="#a78bfa" stroke-width="2" opacity="0.6"/>

  <!-- 文字：ChainMem -->
  <text x="200" y="320" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="bold" fill="#e2e8f0" text-anchor="middle" letter-spacing="3">
    ChainMem
  </text>
  
  <!-- 副标题 -->
  <text x="200" y="345" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" letter-spacing="6">
    链 忆
  </text>

  <!-- 底部装饰点 -->
  <circle cx="185" cy="365" r="2" fill="#22d3ee" opacity="0.5"/>
  <circle cx="200" cy="368" r="2" fill="#a78bfa" opacity="0.5"/>
  <circle cx="215" cy="365" r="2" fill="#22d3ee" opacity="0.5"/>
</svg>
