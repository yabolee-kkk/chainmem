[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chainmem"
version = "0.1.0"
description = "Chain Memory — 链式 + 向量混合记忆系统"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "ChainMem Contributors"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "typer>=0.12",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/ZhuLinsen/chainmem"
Repository = "https://github.com/ZhuLinsen/chainmem"
Documentation = "https://github.com/ZhuLinsen/chainmem#readme"

[project.scripts]
chainmem = "chainmem.cli.app:app"
